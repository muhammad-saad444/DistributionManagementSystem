<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}</style></head><body><title>depotOS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a two-pane screening room. The live phone plays on the left, narration and chapters sit on the right, a chaptered scrubber runs along the bottom. Single dark stage on purpose: it reads like a video player; the app inside keeps its own light look. */
:root{
  color-scheme: dark;
  --stage:#0C1830; --stage-2:#13233F; --stage-3:#1E3256;
  --ink:#EEF1F7; --ink-dim:#A3AEC4; --line:rgba(238,241,247,.12);
  --amber:#E0A63A; --amber-soft:rgba(224,166,58,.16);
  --navy:#15294D; --navy-dark:#0E1D38; --app-bg:#F5F6FA; --card:#FFFFFF; --border:#E3E7EF; --text:#1E2430; --muted:#6B7280;
  --green:#2E8B57; --green-bg:#E6F4EC; --red:#D64545; --red-bg:#FBE8E8; --amber-bg:#FBF0DC;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--stage);color:var(--ink);font-family:var(--f-display)}
*{box-sizing:border-box}

/* ---------- Player shell ---------- */
.player{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-inline:16px;max-width:1280px;margin:0 auto}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px);gap:48px;align-items:center;min-height:0;padding-block:20px}
.phone-area{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.phone-box{width:calc(384px * var(--s,1));height:calc(764px * var(--s,1));position:relative;flex:none}
.side{display:flex;flex-direction:column;gap:26px;min-width:0;max-height:100%;overflow:auto;padding-right:4px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--amber);color:var(--navy-dark);font-weight:800;font-size:12px;display:grid;place-items:center}
.brand b{font-size:14px;font-weight:700}
.brand span{color:var(--ink-dim);font-size:13px}
.brand em{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);border:1px solid var(--line);padding:4px 8px;border-radius:6px}
.cap .kicker{font-family:var(--f-mono);font-size:12px;color:var(--amber);letter-spacing:.07em;text-transform:uppercase}
.cap h2{font-size:clamp(24px,2.5vw,34px);line-height:1.15;margin:10px 0 12px;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
.cap p{color:var(--ink-dim);font-size:15.5px;line-height:1.6;max-width:44ch;margin:0}
.pts{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:9px}
.pts li{display:flex;gap:11px;font-size:14.5px;line-height:1.45}
.pts li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:50%;background:var(--amber)}
.cap.enter{animation:capin .5s both}
.short .cap h2{font-size:clamp(28px,3vw,42px)}
.short .cap p{font-size:17px}
@keyframes capin{from{opacity:0;transform:translateY(8px)}}
.chapters{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:14px}
.chapters h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase;margin:0 0 4px;font-weight:500}
.grp-items{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.chapters button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--ink-dim);font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;cursor:pointer}
.chapters button span{font-family:var(--f-mono);font-size:11px;opacity:.7;min-width:18px;padding-top:2px}
.chapters button:hover{background:var(--stage-2);color:var(--ink)}
.chapters button.cur{background:var(--amber-soft);color:var(--ink)}
.controls{display:flex;align-items:center;gap:12px;padding-block:12px 16px;border-top:1px solid var(--line);transition:opacity .4s}
.cbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--stage-2);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.cbtn svg{width:18px;height:18px}
.cbtn.play{width:46px;height:46px;background:var(--amber);color:var(--navy-dark);border:0}
.cbtn.play svg{width:20px;height:20px}
.bar{flex:1;display:flex;gap:3px;height:28px;align-items:center;min-width:0}
.seg{height:5px;background:var(--stage-3);border-radius:3px;position:relative;overflow:hidden;cursor:pointer;border:0;padding:0;transition:height .15s}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber)}
.seg:hover{height:9px}
.time{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbtn{background:var(--stage-2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;flex:none}
.pbtn svg{width:15px;height:15px}
.cbtn:focus-visible,.chapters button:focus-visible,.seg:focus-visible,.pbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.player.present .chapters{display:none}
.player.present .controls{opacity:0}
.player.present.awake .controls{opacity:1}
@media (max-width:880px){
  html,body{height:auto}
  .player{height:auto}
  .stage{grid-template-columns:1fr;gap:22px}
  .phone-area{height:min(70vh,600px)}
  .side{max-height:none;overflow:visible}
  .controls{position:sticky;bottom:0;background:var(--stage);flex-wrap:wrap;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
  .bar{order:9;flex-basis:100%}
  .time{margin-left:auto}
}
@media (max-width:460px){ .grp-items{grid-template-columns:1fr} .pbtn span{display:none} }

/* ---------- Phone ---------- */
.phone{position:absolute;left:0;top:0;width:384px;height:764px;border-radius:50px;background:#05090F;box-shadow:0 0 0 2px #2A3A58,0 40px 90px rgba(0,0,0,.55);transform-origin:top left;transform:scale(var(--s,1))}
.phone::after{content:"";position:absolute;top:20px;left:50%;width:92px;height:24px;margin-left:-46px;border-radius:14px;background:#05090F;z-index:50}
.screen{position:absolute;inset:12px;border-radius:38px;overflow:hidden;background:var(--app-bg);color:var(--text);font-family:var(--f-display);font-size:12px;line-height:1.35}
.stack{position:absolute;inset:0}
.stack.enter{animation:sin .45s both}
@keyframes sin{from{opacity:0;transform:scale(.985)}}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app-bg)}
.layer.push-l{z-index:15;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.layer.push-l.in{transform:none}
.sbar{height:36px;flex:none;background:var(--navy);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 5px;font-size:11px;font-weight:600}
.sig{display:flex;gap:2px;align-items:flex-end}
.sig i{width:3px;background:#fff;border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px}
.appbar{height:52px;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.appbar b{font-size:14.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .i{width:20px;height:20px;display:block}
.acts{display:flex;gap:14px}
.amb{color:var(--amber)}
.content{flex:1;overflow:hidden;position:relative;min-height:0}
.scroll{padding:14px;display:flex;flex-direction:column;gap:10px}
.bnav{flex:none;height:62px;background:#fff;display:flex;box-shadow:0 -4px 16px rgba(0,0,0,.06);padding-bottom:4px}
.bnav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;color:var(--muted);font-weight:500;white-space:nowrap}
.bnav .i{width:18px;height:18px;padding:4px 11px;box-sizing:content-box;border-radius:9px}
.bnav .on{color:var(--navy);font-weight:700}
.bnav .on .i{background:rgba(224,166,58,.18)}
.i{display:inline-block;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.04);padding:12px}
.tight{padding:4px 10px}
.col{display:flex;flex-direction:column;gap:10px}
.sec{font-weight:700;font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:7px}
.sec::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--amber)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.red{color:var(--red)} .grn{color:var(--green)}

.fld{position:relative}
.fld label{display:block;font-size:10px;color:var(--muted);margin:0 0 4px 2px}
.fld .val{background:var(--app-bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px;min-height:36px;font-size:12px;display:flex;align-items:center;gap:1px;transition:border-color .2s,box-shadow .2s;white-space:nowrap;overflow:hidden}
.fld .tx{overflow:hidden;text-overflow:ellipsis}
.fld .tx:empty::before{content:attr(data-ph);color:#A0A7B4}
.fld.focus .val,.fld.open .val{border-color:var(--amber);box-shadow:0 0 0 2px rgba(224,166,58,.25)}
.caret{display:none;width:1.5px;height:14px;background:var(--navy);animation:blink 1s steps(1) infinite;flex:none}
.fld.focus .caret{display:block}
@keyframes blink{50%{opacity:0}}
.fld.sel .val::after{content:"";margin-left:auto;border:4px solid transparent;border-top-color:var(--muted);margin-top:4px;flex:none}
.menu{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 24px rgba(0,0,0,.14);z-index:12;display:none;overflow:hidden;min-width:180px}
.row>.fld:last-child .menu{left:auto;right:0}
.fld.open .menu{display:block}
.menu div{padding:9px 11px;font-size:11.5px;border-bottom:1px solid #F0F2F6;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--amber);color:var(--navy-dark);font-weight:700;border-radius:9px;padding:11px;font-size:12.5px;transition:transform .15s;text-align:center}
.btn.ol{background:#fff;border:1px solid var(--border);color:var(--navy);font-weight:600}
.btn.nv{background:var(--navy);color:#fff}
.btn.sm{padding:7px 11px;font-size:11px}
.btn .i{width:15px;height:15px}
.pressed{transform:scale(.96)}
.hint{font-size:10px;color:var(--muted);margin:-5px 2px 0}

.toast{position:absolute;left:14px;right:14px;bottom:76px;background:var(--green);color:#fff;border-radius:10px;padding:11px 13px;font-size:11.5px;font-weight:500;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.toast.nonav{bottom:20px}
.toast.in{opacity:1;transform:none}
.fade:not(.in){display:none}
.fade.in{animation:fin .4s both}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
/* table rows only fade: moving a <tr> breaks its cell layout mid-animation */
tr.fade.in{animation-name:fino}
@keyframes fino{from{opacity:0}}
.flash{animation:hl 1.6s}
@keyframes hl{0%,30%{background-color:var(--amber-bg)}100%{background-color:transparent}}

.tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:7px 4px;border-bottom:1px solid var(--border);font-size:9.5px}
.tbl td{padding:7px 4px;border-bottom:1px solid #EEF0F5}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .sum td{font-weight:700;border-bottom:0}
.empty{text-align:center;color:var(--muted);font-size:11px;padding:16px 0;margin:0}
.gone{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--app-bg);border-radius:9px;padding:9px}
.stat small{display:block;font-size:9.5px;color:var(--muted);margin-bottom:2px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}

.scrim{position:absolute;inset:0;background:rgba(14,29,56,.45);opacity:0;transition:opacity .3s;z-index:19;pointer-events:none}
.scrim.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;top:96px;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:20;padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sheet.in{transform:none}
.grab{width:38px;height:4px;border-radius:3px;background:var(--border);align-self:center;flex:none}
.sh-t{font-weight:700;font-size:14px;text-align:center}
.docwrap{background:#E6E9F0;border-radius:8px;padding:12px;flex:1;min-height:0;overflow:hidden}
.doc{background:#fff;padding:14px;font-size:9px;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;line-height:1.5}
.doc .dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:700}
.doc .dh b{font-size:12px}
.doc .dc{text-align:center;font-weight:700}
.doc .dc b{display:block;font-size:15px}
.doc .meta{color:#555}
.dtbl{width:100%;border-collapse:collapse;font-size:8.5px}
.dtbl th{background:#2B6CB0;color:#fff;padding:4px;text-align:left;font-weight:600}
.dtbl.grey th{background:#E0E0E0;color:#222}
.dtbl td{padding:4px;border-bottom:1px solid #ddd}
.dtbl .num{text-align:right}
.dtot{text-align:right}
.pg{text-align:center;font-size:9px;color:#666;margin-top:6px}
.acts-row{display:flex;justify-content:space-around;border-top:1px solid var(--border);padding-top:10px;flex:none}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:4px 8px;border-radius:8px;transition:transform .15s}
.act .i{width:22px;height:22px}

.dlg{position:absolute;left:18px;right:18px;top:50%;background:#fff;border-radius:14px;padding:16px;z-index:22;transform:translateY(-50%) scale(.92);opacity:0;transition:opacity .3s,transform .3s;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px rgba(0,0,0,.25);pointer-events:none}
.dlg.in{opacity:1;transform:translateY(-50%) scale(1)}
.dlg .dh{font-size:14px;font-weight:700}
.dlg-a{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:4px}
.lnk{color:var(--muted);font-weight:600;font-size:11.5px}
.rt{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #EEF0F5}
.rt>div:first-child{flex:1;min-width:0}
.rt b{font-size:11.5px;display:block}
.rt small{font-size:10px;color:var(--muted)}
.fld.mini{width:54px;flex:none}
.fld.mini .val{padding:6px 8px;min-height:30px}
.ok{color:var(--amber);display:flex}
.ok .i{width:22px;height:22px}

/* splash + auth */
.splash{background:linear-gradient(165deg,#1B3461,var(--navy-dark))}
.sp-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:24px}
.logo{width:76px;height:76px;border-radius:22px;background:var(--amber);color:var(--navy-dark);font-weight:800;font-size:28px;display:grid;place-items:center;box-shadow:0 12px 30px rgba(224,166,58,.3)}
.logo.sm{width:52px;height:52px;border-radius:15px;font-size:19px;box-shadow:none}
.splash h1{font-size:27px;margin:10px 0 0;font-weight:700}
.splash p{margin:0;opacity:.75;font-size:12.5px}
.sp-tags{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.sp-tags span{font-size:10.5px;padding:5px 11px;border:1px solid rgba(255,255,255,.25);border-radius:20px}
.rise{animation:rise .8s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.auth .scroll{padding:30px 22px;gap:14px}
.auth h3{font-size:22px;margin:0 0 4px}
.auth p{margin:0}
.c{text-align:center;font-size:10.5px}

/* booker screens */
.chips{display:flex;gap:8px}
.chip{flex:1;text-align:center;padding:8px;border:1px solid var(--border);border-radius:9px;background:#fff;font-size:11.5px;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.plist{padding:2px 12px;display:flex;flex-direction:column}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #EEF0F5}
.prow b{font-size:12px;display:block}
.prow small{font-size:10px;color:var(--muted)}
.prow .num{font-weight:700}
.add-line{padding:10px 0;color:var(--navy);font-weight:600;font-size:11.5px;transition:transform .15s}
.tot{display:flex;flex-direction:column;gap:6px}
.tot div{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.tot b{color:var(--text);font-variant-numeric:tabular-nums}
.tot .gt{border-top:1px dashed var(--border);padding-top:8px;color:var(--text);font-weight:700}
.tot .gt b{color:var(--green);font-size:15px}

/* admin screens */
.welcome{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--navy),#22406F);color:#fff;border-radius:14px;padding:14px}
.welcome b{font-size:16px;display:block}
.welcome small{font-size:10px;opacity:.75}
.live{display:flex;align-items:center;gap:5px;font-size:10px;background:rgba(255,255,255,.12);padding:5px 9px;border-radius:20px}
.live i{width:6px;height:6px;border-radius:50%;background:#5CD08D}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:5px}
.ki{width:28px;height:28px;border-radius:8px;background:var(--amber-bg);color:#A87316;display:grid;place-items:center}
.ki .i{width:15px;height:15px}
.kpi small{font-size:9.5px;color:var(--muted)}
.kpi b{font-size:17px;font-variant-numeric:tabular-nums}
.donut-card{display:flex;align-items:center;gap:14px}
.dwrap{position:relative;width:118px;height:118px;flex:none}
.donut{width:118px;height:118px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16;transition:stroke-dasharray 1.1s ease}
.dctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dctr b{font-size:17px}
.dctr small{font-size:8.5px;color:var(--muted)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:10.5px;flex:1;min-width:0}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-r{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center;font-size:10.5px}
.bar-r .trk{height:8px;background:#EEF0F5;border-radius:4px;overflow:hidden}
.bar-r .trk i{display:block;height:100%;width:0;background:var(--navy);border-radius:4px;transition:width 1.1s ease}
.bar-r:first-child .trk i{background:var(--amber)}
.bars.in .trk i{width:var(--w)}
.bar-r span:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.acts-list{display:flex;flex-direction:column;padding:2px 12px}
.av-r{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #EEF0F5;font-size:11px;line-height:1.4}
.av-r:last-child{border:0}
.av-r .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);margin-top:4px;flex:none}
.av-r small{display:block;color:var(--muted);font-size:9.5px}
.drawer{position:absolute;top:0;bottom:0;left:0;width:255px;background:#fff;z-index:22;transform:translateX(-102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:10px 0 30px rgba(0,0,0,.2)}
.drawer.in{transform:none}

/* ---------- timeline step builders ---------- */
const q = (ctx, sel) => ctx.root.querySelector(sel);
const at = (t, fn) => ({ at:t, run:(ctx,p,inst)=>fn(ctx,inst) });
const tween = (t, d, fn) => ({ at:t, dur:d, run:fn });
const add = (sel, t, c='in') => at(t, ctx => q(ctx,sel)?.classList.add(c));
const rm = (sel, t, c='in') => at(t, ctx => q(ctx,sel)?.classList.remove(c));
function flashEl(el, inst){ if(inst) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
const setText = (sel, t, v, flash=false) => at(t, (ctx,inst) => { const el=q(ctx,sel); el.textContent=v; if(flash) flashEl(el,inst); });
const type = (sel, t, d, str) => tween(t, d, (ctx,p) => { const f=q(ctx,sel); f.querySelector('.tx').textContent = str.slice(0, Math.round(str.length*p)); f.classList.toggle('focus', p < 1); });
const count = (sel, t, d, from, to, pre='') => tween(t, d, (ctx,p) => { q(ctx,sel).textContent = pre + fmt(from + (to-from)*ease(p)); });
const scroll = (t, d, from, to, layer='#main') => tween(t, d, (ctx,p) => {
  const lay=q(ctx,layer), c=lay.querySelector('.content'), s=lay.querySelector('.scroll');
  const max=Math.max(0, s.scrollHeight - c.clientHeight), a=Math.min(from,max), b=Math.min(to,max);
  s.style.transform = `translateY(${-(a + (b-a)*ease(p))}px)`;
});
function point(ctx, sel, inst){
  const el=q(ctx,sel); if(!el) return;
  const s=ctx.screen.getBoundingClientRect(), k=(s.width / ctx.screen.offsetWidth) || 1, r=el.getBoundingClientRect();
  const x=(r.left + r.width/2 - s.left)/k, y=(r.top + r.height/2 - s.top)/k;
  ctx.ptr.style.transition = inst ? 'none' : '';
  ctx.ptr.style.transform = `translate(${x-17}px,${y-17}px)`;
  ctx.ptr.classList.add('on'); ctx.px=x; ctx.py=y;
}
function press(ctx, sel){
  const r=document.createElement('span'); r.className='rip'; r.style.left=ctx.px+'px'; r.style.top=ctx.py+'px';
  ctx.screen.appendChild(r); r.addEventListener('animationend', ()=>r.remove());
  const el=q(ctx,sel); if(el){ el.classList.add('pressed'); setTimeout(()=>el.classList.remove('pressed'), 180); }
}
const tap = (sel, t, fn) => [ at(t, (ctx,inst)=>point(ctx,sel,inst)), at(t+480, (ctx,inst)=>{ if(!inst) press(ctx,sel); fn && fn(ctx,inst); }) ];
const pick = (sel, t, idx, val) => [
  ...tap(`${sel} .val`, t, ctx => q(ctx,sel).classList.add('open')),
  ...tap(`${sel} .menu [data-i="${idx}"]`, t+900, ctx => { const f=q(ctx,sel); f.classList.remove('open'); f.querySelector('.tx').textContent=val; }),
];
const hidePtr = t => at(t, ctx => ctx.ptr.classList.remove('on'));

CUTS.motion = [

    [[0,'depotOS','Run your distribution business on depotOS','Mobile app, website and Windows desktop app.']], [], { contact:true }),

const CINEMA = location.hash === '#motion';
const SHORT_MODE = !!CUTS[location.hash.slice(1)];
const PLAY = CUTS[location.hash.slice(1)] || SCENES;

/* ===================== player engine ===================== */
const screenEl = document.getElementById('screen');
const wscreenEl = document.getElementById('wscreen');
const wbarEl = document.getElementById('wbar');
const area = document.getElementById('phoneArea'), box = document.getElementById('phoneBox'), wideBox = document.getElementById('wideBox');
const capEl = document.getElementById('cap');
const barEl = document.getElementById('bar');
const timeEl = document.getElementById('time');
const playBtn = document.getElementById('play');
const player = document.getElementById('player');
const camEl = document.getElementById('cam'), chipsEl = document.getElementById('chips'), cineCapEl = document.getElementById('cinecap');
if (CINEMA){ player.classList.add('cinema'); document.documentElement.classList.add('cine'); }
const PORTRAIT = CINEMA && innerHeight > innerWidth;
if (PORTRAIT) player.classList.add('portrait');
const N = PLAY.length;
if (SHORT_MODE) player.classList.add('short');
const TOTAL = PLAY.reduce((a,s)=>a+s.dur,0);
const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const REPLAY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5"/></svg>';
let cur=0, t=0, playing=false, ended=false, steps=[], ctx=null, lastTs=null;

/* chapters + scrubber */
const groups = [];
PLAY.forEach((s,i)=>{ let g=groups.find(g=>g.name===s.group); if(!g){ g={name:s.group,items:[]}; groups.push(g); } g.items.push(i); });
document.getElementById('chapters').innerHTML = groups.map(g=>`<div><h3>${g.name}</h3><div class="grp-items">${g.items.map(i=>`<button data-i="${i}"><span>${String(i+1).padStart(2,'0')}</span>${PLAY[i].chapter}</button>`).join('')}</div></div>`).join('');
barEl.innerHTML = PLAY.map((s,i)=>`<button class="seg" data-i="${i}" style="flex:${s.dur}" aria-label="Go to ${s.chapter}" title="${s.chapter}"><i></i></button>`).join('');
const segFills = [...barEl.querySelectorAll('.seg i')];
const chapBtns = [...document.querySelectorAll('.chapters button')];

function enter(i, opts={}){
  cur = i; t = 0; ended = false;
  const sc = PLAY[i];
  const wide = !!sc.device;
  box.hidden = wide; wideBox.hidden = !wide;
  wideBox.querySelector('.wide').classList.toggle('bare', sc.device === 'trio');
  if (wide){
    wbarEl.className = 'wbar ' + (sc.device === 'browser' ? 'browser' : 'desk');
    wbarEl.innerHTML = sc.device === 'browser' ? BROWSER_BAR : DESK_BAR;
  }
  const target = wide ? wscreenEl : screenEl;
  target.innerHTML = `<div class="stack enter">${sc.build()}</div><div class="ptr"></div>`;
  ctx = { root:target, screen:target, ptr:target.querySelector('.ptr'), px:180, py:600 };
  ctx.ptr.style.transition='none'; ctx.ptr.style.transform = wide ? 'translate(480px,520px)' : 'translate(163px,560px)';
  fit();
  // In the 30-second cut a scene starts partway in: shift its timeline and apply everything
  // before the start point instantly, so it opens in the state it would have reached.
  const from = sc.from || 0;
  steps = sc.steps().flat().map(s=>({...s, at:s.at - from, done:false})).sort((a,b)=>a.at-b.at);
  if (from){
    const layers = [...target.firstElementChild.children];
    layers.forEach(el=>el.classList.add('instant'));
    advance(true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>layers.forEach(el=>el.classList.remove('instant'))));
  }
  capEl.classList.remove('enter'); void capEl.offsetWidth;
  capEl.innerHTML = `<div class="kicker">${SHORT_MODE ? sc.kicker : `${sc.group} · ${String(i+1).padStart(2,'0')} / ${N}`}</div><h2>${sc.title}</h2><p>${sc.text}</p><ul class="pts">${sc.points.map(p=>`<li>${p}</li>`).join('')}</ul>`
    + (sc.contact ? `<div class="cap-contact"><small>Book a demo</small><b>Muhammad Saad</b>, Founder &amp; CEO, depotOS<br><span class="ph">0326-5857138</span></div>` : '');
  capEl.classList.add('enter');
  capEl.parentElement.classList.toggle('has-cta', !!sc.contact);
  if (CINEMA){
    // 3D cut: overlay caption, timed caption changes and floating callouts, camera pose
    chipsEl.innerHTML = '';
    player.classList.toggle('has-cta', !!sc.contact);
    setCineCap(sc, sc.caps ? sc.caps[0] : [0, sc.kicker || sc.group, sc.title, sc.text]);
    (sc.caps || []).slice(1).forEach(c => steps.push({ at:c[0], done:false, run:()=>setCineCap(sc, c) }));
    (sc.chips || []).forEach(([at, text, x, y]) => steps.push({ at, done:false, run:()=>addChip(text, x, y) }));
    steps.sort((a,b)=>a.at-b.at);
    applyCam();
  }
  chapBtns.forEach(b=>b.classList.toggle('cur', +b.dataset.i===i));
  updateBar();
}

function setCineCap(sc, [, kicker, title, text]){
  cineCapEl.classList.remove('swap'); void cineCapEl.offsetWidth;
  cineCapEl.innerHTML = `<div class="k">${kicker}</div><h2>${title}</h2><p>${text}</p>`
    + (sc.contact ? `<div class="cta"><small>BOOK A DEMO</small><b>Muhammad Saad</b>, Founder &amp; CEO, depotOS<br><span class="ph">0326-5857138</span></div>` : '');
  cineCapEl.classList.add('swap');
}
function addChip(text, x, y){
  const c = document.createElement('div');
  c.className = 'chip3d'; c.textContent = text;
  if (PORTRAIT) x = Math.min(.88, Math.max(.12, x));   // narrow frame: float over the device, not beside it
  c.style.left = `${x*100}%`; c.style.top = `${y*100}%`;
  chipsEl.appendChild(c);
}
// Camera: ease out from the shot's start pose to its end pose, plus a slow drift so it never sits still.
const POSE0 = { x:0, y:0, rx:0, ry:0, rz:0, s:1 };
function applyCam(){
  const sc = PLAY[cur];
  if (!CINEMA || !sc.cam) { camEl.style.transform = ''; return; }
  const p = Math.min(1, t / sc.dur), e = 1 - Math.pow(1 - p, 3);
  const [a, b] = sc.cam, v = k => (a[k] ?? POSE0[k]) + ((b[k] ?? POSE0[k]) - (a[k] ?? POSE0[k])) * e;
  const drift = Math.sin(t / 1500) * 2.2;
  // Portrait: device centred below the caption; wide screens enlarged, phones a little smaller.
  const x = PORTRAIT ? 0 : v('x');
  // (closing shot: smaller and lower so the Book-a-demo box above it stays clear)
  const y = PORTRAIT ? v('y') + (sc.contact ? .15 : .04) : v('y');
  const s = PORTRAIT ? v('s') * (sc.device ? 1.42 : sc.contact ? .62 : .8) : v('s');
  camEl.style.transform = `translate3d(${x * area.clientWidth}px, ${y * area.clientHeight}px, 0) `
    + `rotateX(${v('rx') + drift * .4}deg) rotateY(${v('ry') + drift}deg) rotateZ(${v('rz')}deg) scale(${s})`;
}
function advance(inst=false){
  for (const s of steps){
    if (s.done || t < s.at) continue;
    const p = s.dur ? Math.min(1, (t - s.at)/s.dur) : 1;
    s.run(ctx, p, inst);
    if (p >= 1) s.done = true;
  }
}
const mmss = ms => { const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
function updateBar(){
  segFills.forEach((f,i)=>{ f.style.width = i<cur ? '100%' : i>cur ? '0%' : `${Math.min(100, t/PLAY[cur].dur*100)}%`; });
  const before = PLAY.slice(0,cur).reduce((a,s)=>a+s.dur,0);
  timeEl.textContent = `${mmss(before+t)} / ${mmss(TOTAL)}`;
}
function setPlaying(v){
  playing = v;
  playBtn.innerHTML = v ? PAUSE_SVG : (ended ? REPLAY_SVG : PLAY_SVG);
  playBtn.setAttribute('aria-label', v ? 'Pause' : (ended ? 'Replay' : 'Play'));
}
function frame(ts){
  if (lastTs === null) lastTs = ts;
  const dt = Math.min(100, ts - lastTs); lastTs = ts;
  if (playing && !window.__manual){
    t += dt; advance();
    if (t >= PLAY[cur].dur){
      if (cur < N-1) enter(cur+1);
      else { t = PLAY[cur].dur; ended = true; setPlaying(false); }
    }
    updateBar();
  }
  if (CINEMA && !window.__manual) applyCam();
  requestAnimationFrame(frame);
}
// Offline rendering: a recorder sets window.__manual = true and calls __tick(ms) once per video frame.
// It advances the scene clock, the 3D camera and every CSS animation/transition by exactly `dt`,
// so slow (GPU-less) rendering still produces smooth, correctly timed frames.
window.__tick = (dt) => {
  if (playing){
    t += dt; advance();
    if (t >= PLAY[cur].dur){
      if (cur < N-1) enter(cur+1);
      else { t = PLAY[cur].dur; ended = true; setPlaying(false); }
    }
    updateBar();
  }
  if (CINEMA) applyCam();
  for (const a of document.getAnimations()){
    if (a.__vt === undefined){ a.pause(); a.__vt = 0; }
    a.__vt += dt;
    a.currentTime = a.__vt;
  }
};
function go(i){ enter(Math.max(0, Math.min(N-1, i))); setPlaying(true); }

playBtn.addEventListener('click', ()=>{ if (ended){ go(0); return; } setPlaying(!playing); });
document.getElementById('prev').addEventListener('click', ()=>go(t > 1500 ? cur : cur-1));
document.getElementById('next').addEventListener('click', ()=>go(cur+1));
barEl.addEventListener('click', e=>{ const b=e.target.closest('.seg'); if(b) go(+b.dataset.i); });
document.getElementById('chapters').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.i); });
document.addEventListener('keydown', e=>{
  if (e.code==='Space' && e.target.tagName!=='BUTTON'){ e.preventDefault(); playBtn.click(); }
  else if (e.key==='ArrowRight') go(cur+1);
  else if (e.key==='ArrowLeft') go(cur-1);
  else if (e.key==='f' || e.key==='F') document.getElementById('present').click();
});

/* present mode: full screen, chapter list hidden, controls fade when idle */
let idleTimer;
function wake(){ player.classList.add('awake'); clearTimeout(idleTimer); idleTimer = setTimeout(()=>player.classList.remove('awake'), 2200); }
document.getElementById('present').addEventListener('click', ()=>{
  const on = !player.classList.contains('present');
  player.classList.toggle('present', on);
  if (on){ wake(); try { document.documentElement.requestFullscreen?.().catch(()=>{}); } catch(_){} }
  else if (document.fullscreenElement){ document.exitFullscreen?.().catch(()=>{}); }
  requestAnimationFrame(fit);
});
document.addEventListener('fullscreenchange', ()=>{ if (!document.fullscreenElement) player.classList.remove('present'); requestAnimationFrame(fit); });
document.addEventListener('mousemove', ()=>{ if (player.classList.contains('present')) wake(); });

/* fit the phone to the available space */
function fit(){
  const s = Math.max(.42, Math.min(area.clientHeight/764, area.clientWidth/384, 1.15));
  box.style.setProperty('--s', s.toFixed(3));
  const ws = Math.max(.3, Math.min(area.clientHeight/640, area.clientWidth/1000, 1));
  wideBox.style.setProperty('--ws', ws.toFixed(3));
}
window.addEventListener('resize', fit);
fit();
enter(0);
setPlaying(false);
requestAnimationFrame(frame);
(document.fonts?.ready || Promise.resolve()).then(()=>{ fit(); setTimeout(()=>{ if (!playing && cur===0 && t===0) setPlaying(true); }, 600); });
</script>
